name: Update Google Scholar Data

on:
  schedule:
    # Daily attempts make transient Google Scholar blocks less disruptive.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-google-scholar
  cancel-in-progress: false

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check scholarly==1.7.11 PyYAML==6.0.2

      - name: Fetch Scholar data with retries
        env:
          GOOGLE_SCHOLAR_ID: wQ_pDQYAAAAJ
        run: |
          python <<'PY'
          import os
          import random
          import time
          from datetime import datetime, timezone

          import yaml
          from scholarly import scholarly

          scholar_id = os.environ["GOOGLE_SCHOLAR_ID"]

          for attempt in range(1, 5):
              try:
                  author = scholarly.search_author_id(scholar_id)
                  author = scholarly.fill(author, sections=["basics", "indices"])
                  citations = int(author.get("citedby", 0))
                  h_index = int(author.get("hindex", 0))
                  i10_index = int(author.get("i10index", 0))

                  if citations <= 0:
                      raise RuntimeError("Google Scholar returned an empty citation count")

                  data = {
                      "citations": citations,
                      "h_index": h_index,
                      "i10_index": i10_index,
                      "scholar_url": f"https://scholar.google.com/citations?user={scholar_id}",
                      "last_updated": datetime.now(timezone.utc).date().isoformat(),
                  }

                  with open("_data/scholar.yml", "w", encoding="utf-8") as output:
                      yaml.safe_dump(data, output, allow_unicode=True, sort_keys=False)

                  print(f"Updated Scholar metrics: {citations} citations, h-index {h_index}, i10-index {i10_index}")
                  break
              except Exception as error:
                  if attempt == 4:
                      raise RuntimeError(f"Google Scholar remained unavailable after {attempt} attempts: {error}") from error
                  delay = random.randint(25, 75)
                  print(f"Attempt {attempt} failed: {error}. Retrying in {delay} seconds...")
                  time.sleep(delay)
          PY

      - name: Commit updated metrics
        run: |
          if git diff --quiet -- _data/scholar.yml; then
            echo "Scholar metrics are unchanged."
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add _data/scholar.yml
          git commit -m "chore: update Google Scholar metrics [skip ci]"
          git push
